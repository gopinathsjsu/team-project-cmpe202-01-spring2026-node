<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="1100" height="780" fill="#f8f9fc"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Node Event Management Platform — HLD</text>

  <!-- ===== UI Layer ===== -->
  <rect x="400" y="70" width="300" height="54" rx="8" fill="#4361ee" opacity="0.9"/>
  <text x="550" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">React Frontend (UI)</text>
  <text x="550" y="113" text-anchor="middle" font-size="10" fill="#cdd3ff">Attendee · Organizer · Admin</text>

  <!-- ===== Arrows from UI ===== -->
  <!-- UI → Identity -->
  <line x1="430" y1="124" x2="185" y2="195" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- UI → Event -->
  <line x1="490" y1="124" x2="310" y2="195" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- UI → Discovery -->
  <line x1="550" y1="124" x2="550" y2="195" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- UI → Registration -->
  <line x1="610" y1="124" x2="790" y2="195" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ===== Service Row ===== -->

  <!-- Identity & Admin Service -->
  <rect x="20" y="195" width="200" height="100" rx="8" fill="#3a0ca3"/>
  <text x="120" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Identity &amp; Admin Service</text>
  <text x="120" y="236" text-anchor="middle" font-size="9" fill="#c5b9f5">Auth · JWT · RBAC</text>
  <text x="120" y="250" text-anchor="middle" font-size="9" fill="#c5b9f5">User / Organizer Profiles</text>
  <text x="120" y="264" text-anchor="middle" font-size="9" fill="#c5b9f5">Admin Moderation</text>
  <text x="120" y="278" text-anchor="middle" font-size="9" fill="#c5b9f5">Audit Logging</text>

  <!-- Event Service -->
  <rect x="250" y="195" width="180" height="100" rx="8" fill="#7209b7"/>
  <text x="340" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Event Service</text>
  <text x="340" y="236" text-anchor="middle" font-size="9" fill="#e0bfff">CRUD · Lifecycle</text>
  <text x="340" y="250" text-anchor="middle" font-size="9" fill="#e0bfff">Draft→Submitted→Approved</text>
  <text x="340" y="264" text-anchor="middle" font-size="9" fill="#e0bfff">Capacity · Media</text>
  <text x="340" y="278" text-anchor="middle" font-size="9" fill="#e0bfff">Metadata</text>

  <!-- Discovery Service -->
  <rect x="460" y="195" width="180" height="100" rx="8" fill="#0077b6"/>
  <text x="550" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Discovery Service</text>
  <text x="550" y="236" text-anchor="middle" font-size="9" fill="#bde0f7">Full-text Search</text>
  <text x="550" y="250" text-anchor="middle" font-size="9" fill="#bde0f7">Filters: Date · Category</text>
  <text x="550" y="264" text-anchor="middle" font-size="9" fill="#bde0f7">Location · Pagination</text>
  <text x="550" y="278" text-anchor="middle" font-size="9" fill="#bde0f7">OpenSearch / Elasticsearch</text>

  <!-- Ticket Registration Service -->
  <rect x="670" y="195" width="200" height="100" rx="8" fill="#0096c7"/>
  <text x="770" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Ticket Registration</text>
  <text x="770" y="236" text-anchor="middle" font-size="9" fill="#b8eaf7">TTL-based Holds</text>
  <text x="770" y="250" text-anchor="middle" font-size="9" fill="#b8eaf7">Atomic Capacity Constraints</text>
  <text x="770" y="264" text-anchor="middle" font-size="9" fill="#b8eaf7">Overbooking Prevention</text>
  <text x="770" y="278" text-anchor="middle" font-size="9" fill="#b8eaf7">Idempotency · Outbox</text>

  <!-- ===== Sync arrows between services ===== -->
  <!-- Identity ↔ Event (moderation) -->
  <line x1="220" y1="240" x2="250" y2="240" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrowback)"/>
  <text x="235" y="233" text-anchor="middle" font-size="8" fill="#555">sync</text>

  <!-- Event → Discovery (reindex) -->
  <line x1="430" y1="250" x2="460" y2="250" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="243" text-anchor="middle" font-size="8" fill="#555">sync</text>

  <!-- Registration → Event (optional validation) -->
  <line x1="670" y1="260" x2="430" y2="260" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="550" y="272" text-anchor="middle" font-size="8" fill="#555">optional sync read</text>

  <!-- ===== Message Queue ===== -->
  <rect x="620" y="360" width="200" height="50" rx="8" fill="#f77f00"/>
  <text x="720" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Message Queue</text>
  <text x="720" y="397" text-anchor="middle" font-size="9" fill="#fff">(Kafka / RabbitMQ / SQS)</text>

  <!-- Registration → MQ -->
  <line x1="770" y1="295" x2="750" y2="360" stroke="#f77f00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="785" y="332" font-size="8" fill="#f77f00">async</text>

  <!-- ===== Notification Service ===== -->
  <rect x="880" y="355" width="190" height="60" rx="8" fill="#e63946"/>
  <text x="975" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Notification Service</text>
  <text x="975" y="395" text-anchor="middle" font-size="9" fill="#ffc8cb">Confirmation Emails · Reminders</text>

  <!-- MQ → Notification -->
  <line x1="820" y1="385" x2="880" y2="385" stroke="#e63946" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="850" y="378" text-anchor="middle" font-size="8" fill="#e63946">consume</text>

  <!-- ===== Supporting Services ===== -->
  <text x="120" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Supporting Services</text>

  <!-- Maps -->
  <rect x="20" y="395" width="200" height="70" rx="8" fill="#2d6a4f"/>
  <text x="120" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Maps Integration</text>
  <text x="120" y="435" text-anchor="middle" font-size="9" fill="#b7e4c7">Address Validation</text>
  <text x="120" y="449" text-anchor="middle" font-size="9" fill="#b7e4c7">Geocoding · Map Link Generation</text>

  <!-- Calendar -->
  <rect x="240" y="395" width="200" height="70" rx="8" fill="#1b4332"/>
  <text x="340" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Calendar Integration</text>
  <text x="340" y="435" text-anchor="middle" font-size="9" fill="#b7e4c7">ICS File Generation</text>
  <text x="340" y="449" text-anchor="middle" font-size="9" fill="#b7e4c7">Google OAuth Calendar</text>

  <!-- Arrows from UI to supporting -->
  <line x1="460" y1="124" x2="120" y2="395" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="124" x2="340" y2="395" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ===== Data Stores ===== -->
  <text x="550" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Data Stores</text>

  <!-- PostgreSQL -->
  <rect x="100" y="535" width="160" height="50" rx="6" fill="#2b6cb0"/>
  <text x="180" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PostgreSQL + PostGIS</text>
  <text x="180" y="573" text-anchor="middle" font-size="9" fill="#bee3f8">Identity · Events · Bookings</text>

  <!-- OpenSearch -->
  <rect x="290" y="535" width="160" height="50" rx="6" fill="#d97706"/>
  <text x="370" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">OpenSearch</text>
  <text x="370" y="573" text-anchor="middle" font-size="9" fill="#fef3c7">Discovery Index</text>

  <!-- Redis -->
  <rect x="480" y="535" width="160" height="50" rx="6" fill="#c53030"/>
  <text x="560" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Redis / Cache</text>
  <text x="560" y="573" text-anchor="middle" font-size="9" fill="#fed7d7">TTL Holds · Session</text>

  <!-- Object Storage -->
  <rect x="670" y="535" width="160" height="50" rx="6" fill="#276749"/>
  <text x="750" y="557" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Object Storage</text>
  <text x="750" y="573" text-anchor="middle" font-size="9" fill="#c6f6d5">Event Banners (S3)</text>

  <!-- Connecting services to data stores -->
  <line x1="120" y1="295" x2="180" y2="535" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="340" y1="295" x2="300" y2="535" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="550" y1="295" x2="370" y2="535" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="770" y1="295" x2="560" y2="535" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="770" y1="295" x2="750" y2="535" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ===== Missing Section ===== -->
  <rect x="30" y="630" width="1040" height="120" rx="8" fill="#fff3cd" stroke="#f0ad4e" stroke-width="1.5"/>
  <text x="550" y="655" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">NOT YET DESIGNED — Missing from Architecture</text>

  <!-- Analytics -->
  <rect x="60" y="668" width="460" height="65" rx="6" fill="#ffeeba" stroke="#f0ad4e" stroke-width="1"/>
  <text x="290" y="686" text-anchor="middle" font-size="11" font-weight="bold" fill="#533f03">Analytics Dashboard</text>
  <text x="290" y="702" text-anchor="middle" font-size="9" fill="#533f03">Registrations · Capacity Utilization · Approval Rates</text>
  <text x="290" y="716" text-anchor="middle" font-size="9" fill="#533f03">Revenue Summaries for Organizer &amp; Admin</text>
  <text x="290" y="730" text-anchor="middle" font-size="9" fill="#856404">→ Needs dedicated Analytics Service or reporting layer</text>

  <!-- Payment -->
  <rect x="570" y="668" width="460" height="65" rx="6" fill="#ffeeba" stroke="#f0ad4e" stroke-width="1"/>
  <text x="800" y="686" text-anchor="middle" font-size="11" font-weight="bold" fill="#533f03">Payment Handling</text>
  <text x="800" y="702" text-anchor="middle" font-size="9" fill="#533f03">Payment Gateway (Stripe / PayPal) · Receipts</text>
  <text x="800" y="716" text-anchor="middle" font-size="9" fill="#533f03">Refunds on Cancellation · Revenue Tracking</text>
  <text x="800" y="730" text-anchor="middle" font-size="9" fill="#856404">→ Needs Payment Service scoped into architecture</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
    <marker id="arrowback" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f77f00"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e63946"/>
    </marker>
  </defs>

</svg>

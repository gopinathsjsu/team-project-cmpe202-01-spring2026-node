# HTTP for raw IP (:80 default_server), ACME HTTP-01, and non-TLS classmates.
server {
    listen 80 default_server;
    server_name _;

    root /opt/node-app/node_frontend_app/dist;
    index index.html;

    # Applied to every `proxy_pass` in the included API snippet (timeouts inherit into each location).
    proxy_connect_timeout 15s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;

    # Let's Encrypt HTTP-01 (same pattern as Certbot nginx installer). Run issue-le-cert-webroot.sh after DNS points here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    include /etc/nginx/snippets/node-app-api-locations.conf;
}

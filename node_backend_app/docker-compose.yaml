# Run from this directory: docker compose up --build
#
# Frontend (dev): from node_frontend_app run `npm run dev` (port 5174). Vite proxies /api/v1 to
# events-service :8080 and /api/v1/bookings + /api/v1/ticket-types to booking-service :8082.
#
# Services and ports (host):
#   events-service         http://localhost:8080
#   identity-service      http://localhost:8081
#   booking-service       http://localhost:8082
#   notification-service  http://localhost:8083
#   discovery-service     http://localhost:8084
#   PostgreSQL (PostGIS)  localhost:5433
#   Kafka                 localhost:9092
#
# EC2 note: Stable project name + shared bridge network avoids UnknownHostException: postgres
# when compose is run from different paths. Use `docker compose -p node-platform` if you pass -f
# from outside this directory. Prefer t3.small+ for all services; free-tier + swap is tight.

name: node-platform

networks:
  node-platform-net:
    name: node-platform-net

x-spring-jvm: &spring-jvm
  JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -Xmx300m -Xms128m"

x-spring-hikari: &spring-hikari
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "60000"
  SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: "5000"

x-spring-healthcheck: &spring-healthcheck
  interval: 15s
  timeout: 12s
  retries: 20
  start_period: 240s

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: node-postgres


    restart: unless-stopped
    networks:
      node-platform-net:
        aliases:
          - postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: event_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/02-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: node-zookeeper
    restart: unless-stopped
    networks:
      - node-platform-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: node-kafka
    restart: unless-stopped
    networks:
      - node-platform-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 25
      start_period: 180s

  # One-shot topic bootstrap. Idempotent (--if-not-exists).
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: node-kafka-init
    networks:
      - node-platform-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic booking.events --partitions 1 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic event.events   --partitions 1 --replication-factor 1 &&
       echo 'Topics ready.'"
    restart: "no"

  events-service:
    build:
      context: ./eventServices
      dockerfile: Dockerfile
    container_name: events-service
    restart: unless-stopped
    init: true
    networks:
      - node-platform-net
    ports:
      - "8080:8080"
    environment:
      <<: [*spring-jvm, *spring-hikari]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlLXNlY3JldC1rZXktZm9yLWV2ZW50LXBsYXRmb3JtLWlkZW50aXR5LXNlcnZpY2UtMjAyNg==}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      <<: *spring-healthcheck

  booking-service:
    build:
      context: ./bookingService
      dockerfile: Dockerfile
    container_name: booking-service
    restart: unless-stopped
    init: true
    networks:
      - node-platform-net
    ports:
      - "8082:8082"
    environment:
      <<: [*spring-jvm, *spring-hikari]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_EVENT_SERVICE_BASE_URL: http://events-service:8080
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlLXNlY3JldC1rZXktZm9yLWV2ZW50LXBsYXRmb3JtLWlkZW50aXR5LXNlcnZpY2UtMjAyNg==}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      events-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/liveness"]
      <<: *spring-healthcheck

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    restart: unless-stopped
    init: true
    networks:
      - node-platform-net
    ports:
      - "8081:8081"
    environment:
      <<: [*spring-jvm, *spring-hikari]
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: identity_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      EVENT_SERVICE_URL: http://events-service:8080
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlLXNlY3JldC1rZXktZm9yLWV2ZW50LXBsYXRmb3JtLWlkZW50aXR5LXNlcnZpY2UtMjAyNg==}
    depends_on:
      postgres:
        condition: service_healthy
      events-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/liveness"]
      <<: *spring-healthcheck

  notification-service:
    build:
      context: ./notificationService
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    init: true
    networks:
      - node-platform-net
    ports:
      - "8083:8083"
    environment:
      <<: [*spring-jvm, *spring-hikari]
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Optional: set when you have SMTP / Firebase
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/tmp/firebase-not-configured.json}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/liveness"]
      <<: *spring-healthcheck

  discovery-service:
    build:
      context: ./discoveryService
      dockerfile: Dockerfile
    container_name: discovery-service
    restart: unless-stopped
    init: true
    networks:
      - node-platform-net
    ports:
      - "8084:8084"
    environment:
      <<: [*spring-jvm, *spring-hikari]
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      events-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/liveness"]
      <<: *spring-healthcheck

volumes:
  postgres_data:

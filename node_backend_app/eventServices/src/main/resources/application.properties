spring.application.name=eventServices
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/event_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — shared secret across all microservices
application.security.jwt.secret-key=${JWT_SECRET:c2VjdXJlLXNlY3JldC1rZXktZm9yLWV2ZW50LXBsYXRmb3JtLWlkZW50aXR5LXNlcnZpY2UtMjAyNg==}
application.security.jwt.expiration=86400000

# Logging — pattern/encoder configured in logback-spring.xml (JSON output).
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.node.eventServices=DEBUG

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator

# Kafka producer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

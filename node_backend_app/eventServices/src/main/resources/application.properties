spring.application.name=eventServices
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/event_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — shared secret across all microservices
application.security.jwt.secret-key=c2VjdXJlLXNlY3JldC1rZXktZm9yLWV2ZW50LXBsYXRmb3JtLWlkZW50aXR5LXNlcnZpY2UtMjAyNg==
application.security.jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.node.eventServices=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

spring.application.name=bookingService
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — shared secret with eventServices and identity-service
application.security.jwt.secret-key=${JWT_SECRET:c2VjdXJlLXNlY3JldC1rZXktZm9yLWV2ZW50LXBsYXRmb3JtLWlkZW50aXR5LXNlcnZpY2UtMjAyNg==}
application.security.jwt.expiration=86400000

# Payment strategy: mock | stripe | paypal
booking.payment.strategy=mock

# Event service URL for inter-service communication
booking.event-service.base-url=http://localhost:8080
booking.event-service.timeout-seconds=10

# Kafka producer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.node.bookingService=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

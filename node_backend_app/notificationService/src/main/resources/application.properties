spring.application.name=notificationService
server.port=${SERVER_PORT:8083}

# Logging — pattern/encoder configured in logback-spring.xml (JSON output).
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.node.notificationService=DEBUG

# Database (for FCM token storage + reminder queries)
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

# Wrap both deserializers in ErrorHandlingDeserializer so a single bad record
# (poison pill) is logged and skipped instead of looping the consumer forever.
# The "delegate.*" properties below configure the real deserializers used inside.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.node.notificationService.events

# Mail (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Firebase
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}

# Don't fail the service-level /actuator/health when SMTP creds aren't set.
# The MailHealthIndicator pings the SMTP server on every probe, which isn't
# meaningful for our deployment health. Mail send errors are still logged.
management.health.mail.enabled=false
